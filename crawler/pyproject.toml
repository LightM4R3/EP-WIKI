[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epwiki-crawler"
version = "0.1.0"
description = "Selenium data collection pipeline for EP-WIKI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4,<5",
  "selenium>=4,<5",
]

[project.scripts]
epwiki-crawler = "epwiki_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
